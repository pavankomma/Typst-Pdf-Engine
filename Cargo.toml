[package]
name = "template-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Render Typst templates with JSON data into PDF"
license = "MIT"
repository = "https://github.com/pavankomma/TemplateEngine.Public"
readme = "README.md"
keywords = ["typst", "pdf", "template"]
categories = ["command-line-utilities", "template-engine"]

[[bin]]
name = "tmpl"
path = "src/main.rs"
test = false

[dependencies]
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
missing_docs_in_private_items = "deny"
allow_attributes_without_reason = "deny"
